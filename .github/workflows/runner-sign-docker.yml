name: Sign In or Sign Out (Docker)

on:
  workflow_dispatch:

jobs:
  run-signin:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Docker Pull
      run: docker pull wulukewu/mcl-sign-in-system:latest

    - name: Setup WireGuard (optional)
      uses: ./.github/actions/setup-wireguard
      with:
        config: ${{ secrets.wg_conf }}

    - name: Docker Sign In or Sign Out
      run: |
        username="${{ secrets.username }}"
        password="${{ secrets.password }}"
        otpauth="${{ secrets.otpauth }}"
        cookies="${{ secrets.cookies }}"
        discord_webhook_url="${{ secrets.discord_webhook_url }}"
        discord_token="${{ secrets.discord_token }}"
        discord_guild_id="${{ secrets.discord_guild_id }}"
        discord_channel_id="${{ secrets.discord_channel_id }}"
        
        docker run \
          -e username="$username" \
          -e password="$password" \
          -e otpauth="$otpauth" \
          -e cookies="$cookies" \
          -e discord_webhook_url="$discord_webhook_url" \
          -e discord_token="$discord_token" \
          -e discord_guild_id="$discord_guild_id" \
          -e discord_channel_id="$discord_channel_id" \
          wulukewu/mcl-sign-in-system:latest
